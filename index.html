
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Telemetronica Studios</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a0a0a;
      color: #efefec;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Helvetica Neue", Arial, sans-serif;
      display: grid;
      place-items: center;
    }
    main { padding: 32px; text-align: center; }
    h1 {
      font-size: clamp(24px, 5vw, 46px);
      font-weight: 500;
      letter-spacing: .09em;
      margin: 0 0 14px;
    }
    p {
      color: #888;
      font-size: 12px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .line {
      background: #c47d55;
      width: 32px;
      height: 2px;
      margin: 36px auto;
    }
    small { color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>TELEMETRONICA</h1>
    <p>Studios</p>
    <div class="line"></div>
    <small>Independent software & games</small>
  </main>
</body>
</html>
